[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qcdt-builder"
version = "0.1.0"
description = "Build Qualcomm QCDT v3 images from DTB files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
qcdt-builder = "qcdt_builder.cli:main"

[tool.setuptools.packages.find]
include = ["qcdt_builder*"]
